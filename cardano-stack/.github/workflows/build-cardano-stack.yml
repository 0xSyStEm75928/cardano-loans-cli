name: build-cardano-stack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Cardano binary cache
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' \
            'experimental-features = nix-command flakes' \
            'substituters = https://cache.nixos.org https://cache.iog.io' \
            'trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShY=' \
            | sudo tee /etc/nix/nix.conf

      - name: Build cardano-node
        working-directory: cardano-node
        run: |
          nix build .#cardano-node -o ../node-result

      - name: Build cardano-cli
        working-directory: cardano-node
        run: |
          nix build .#cardano-cli -o ../cli-result

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp node-result/bin/cardano-node artifacts/cardano-node
          cp cli-result/bin/cardano-cli artifacts/cardano-cli
          chmod +x artifacts/*
          file artifacts/*
          ./artifacts/cardano-node --version
          ./artifacts/cardano-cli --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardano-stack-linux-x86_64
          path: artifacts/
