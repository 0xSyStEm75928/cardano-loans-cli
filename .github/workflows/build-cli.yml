name: build-cardano-loans-cli

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.5'
          cabal-version: '3.12.1.0'
          cabal-update: false
 
      - name: Fix Cabal PATH
        run: echo "/usr/local/.ghcup/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libgmp-dev \
            libffi-dev \
            zlib1g-dev

      - name: Verify blst pkg-config
        run: |
          echo '=== libblst-dev files ==='
          dpkg -L libblst-dev | grep -E '(/pkgconfig/|\\.pc$)' || true
          echo '=== blst pkg-config files ==='
          find /usr -name '*.pc' -type f 2>/dev/null | grep -i blst || true
          echo '=== pkg-config ==='
          pkg-config --list-all | grep -i blst || true
          pkg-config --modversion libblst-any || true

      - name: Configure blst
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "=== libblst-dev files ==="
          dpkg -L libblst-dev | grep -E '(/pkgconfig/|\\.pc$)' || true
          echo "=== blst pkg-config files ==="
          find /usr -name '*.pc' -type f 2>/dev/null | grep -i blst || true
          echo "=== pkg-config entries ==="
          pkg-config --list-all | grep -i blst || true
          echo "=== libblst-any ==="
          pkg-config --modversion libblst-any || true
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cabal clean
          cabal update --index-state=2026-01-01T00:00:00Z
          cabal build exe:cardano-loans -v2

      - name: Locate binary
        run: |
          BIN="$(cabal list-bin exe:cardano-loans)"
          cp "$BIN" cardano-loans-linux-x86_64
          chmod +x cardano-loans-linux-x86_64
          file cardano-loans-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cardano-loans-cli
          path: cardano-loans-linux-x86_64
