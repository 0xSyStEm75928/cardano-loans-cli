name: build-cardano-loans-cli

on:
  workflow_dispatch:

jobs:

    # PHASE 1: CONNECT
    # ZER -> ASH -> JSSH -> CURL -> external source / Koios

  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.5'
          cabal-version: '3.12.1.0'
          cabal-update: false
 
      - name: Fix Cabal PATH
        run: echo "/usr/local/.ghcup/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          apt-cache search blst || true
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libgmp-dev \
            libffi-dev \
            zlib1g-dev

      - name: Verify blst pkg-config
        run: |
          echo '=== libblst-dev files ==='
          dpkg -L libblst-dev | grep -E '(/pkgconfig/|\\.pc$)' || true
          echo '=== blst pkg-config files ==='
          find /usr -name '*.pc' -type f 2>/dev/null | grep -i blst || true
          echo '=== pkg-config ==='
          pkg-config --list-all | grep -i blst || true
          pkg-config --modversion libblst-any || true

      - name: Configure blst
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "=== libblst-dev files ==="
          dpkg -L libblst-dev | grep -E '(/pkgconfig/|\\.pc$)' || true
          echo "=== blst pkg-config files ==="
          find /usr -name '*.pc' -type f 2>/dev/null | grep -i blst || true
          echo "=== pkg-config entries ==="
          pkg-config --list-all | grep -i blst || true
          echo "=== libblst-any ==="
          pkg-config --modversion libblst-any || true
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Yu1 blst bridge
        run: |
          command -v yu1 || true
          find /usr /opt /home/runner -type f -name "libblst-any.pc" 2>/dev/null | head -20
          pkg-config --modversion libblst-any || true
      - name: PHASE 1 - CONNECT
        run: |
          echo "PHASE=1"
          echo "ZER_MODE=${ZER_MODE:-ZER}"
          echo "ZER_BASE=${ZER_BASE:-ASH}"
          echo "ZER_PRIORITY=${ZER_PRIORITY:-JSSH}"
          echo "ZER_CONNECTION=${ZER_CONNECTION:-CURL}"
          echo "ZER_SOURCE=GITHUB"
          echo "KOIOS=${KOIOS_URL:-https://api.koios.rest/api/v1}"
          curl -fsSL "${KOIOS_URL:-https://api.koios.rest/api/v1}/tip" >/dev/null
          echo "CONNECT=SUCCESS"


      - name: ZER blst bridge
        run: |
          git clone --depth 1 https://github.com/supranational/blst.git /tmp/blst
          cd /tmp/blst
          ./build.sh
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo cp libblst.a /usr/local/lib/
          sudo mkdir -p /usr/local/include
          sudo cp bindings/blst.h bindings/blst_aux.h /usr/local/include/
          printf "%s\n" "prefix=/usr/local" "libdir=\${prefix}/lib" "includedir=\${prefix}/include" "Name: libblst-any" "Description: blst" "Version: 0.3.0" "Libs: -L\${libdir} -lblst" "Cflags: -I\${includedir}" | sudo tee /usr/local/lib/pkgconfig/libblst-any.pc >/dev/null
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          pkg-config --modversion libblst-any
      - name: PHASE 2 - BUILD
        run: |
          echo "PHASE=2"
          echo "BUILD=START"
          pkg-config --exists libblst-any
          echo "BLST=READY"

      - name: Build
        shell: bash
        run: |
          set -e
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          pkg-config --modversion libblst-any
          pkg-config --exists libblst-any
          cabal clean
          cabal update --index-state=2026-01-01T00:00:00Z
          cabal build exe:cardano-loans -v2

      - name: PHASE 3 - ARTIFACT
        run: |
          echo "PHASE=3"
          echo "SLIDE=READY"
          echo "LOCATE=NEXT"

      - name: Slide Orchestra
        run: |
          BIN="$(cabal list-bin exe:cardano-loans)"
          test -x "$BIN"
          cp "$BIN" /tmp/cardano-loans-slide
          chmod +x /tmp/cardano-loans-slide
          echo "SLIDE_BINARY=/tmp/cardano-loans-slide"
          file /tmp/cardano-loans-slide
      - name: Locate binary
        run: |
          BIN="$(cabal list-bin exe:cardano-loans)"
          cp "$BIN" cardano-loans-linux-x86_64
          chmod +x cardano-loans-linux-x86_64
          file cardano-loans-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cardano-loans-cli
          path: cardano-loans-linux-x86_64
