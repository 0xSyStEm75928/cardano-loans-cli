name: Build ZER EVM CLI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: evm-cli/package-lock.json

      - name: Install dependencies
        working-directory: evm-cli
        run: npm ci

      - name: Compile contracts
        working-directory: evm-cli
        run: npm run compile

      - name: Build TypeScript
        working-directory: evm-cli
        run: npm run build

      - name: Run tests
        working-directory: evm-cli
        run: npm test

      - name: Verify CLI
        working-directory: evm-cli
        run: |
          npx tsx src/cli.ts --version
          npx tsx src/cli.ts --help

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: zer-evm-cli-node${{ matrix.node }}
          path: |
            evm-cli/dist/
            evm-cli/artifacts/
            evm-cli/typechain-types/
          if-no-files-found: warn

  solidity:
    name: Solidity ${{ matrix.solc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solc: ['0.8.24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evm-cli/package-lock.json

      - name: Install dependencies
        working-directory: evm-cli
        run: npm ci

      - name: Compile contracts
        working-directory: evm-cli
        run: npm run compile

      - name: Run contract tests
        working-directory: evm-cli
        run: npx hardhat test

      - name: Gas report
        if: matrix.solc == '0.8.24'
        working-directory: evm-cli
        run: REPORT_GAS=true npx hardhat test
        env:
          REPORT_GAS: true
