name: build-standalone

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Standalone CLI Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.6', '9.8.4']
        cabal: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev \
            libffi-dev \
            zlib1g-dev \
            pkg-config

      - name: Build standalone CLI
        run: |
          cabal update
          cabal build all --project-file=cardano-loans-standalone.cabal

      - name: Check cabal file
        run: cabal check --project-file=cardano-loans-standalone.cabal

      - name: Verify binary
        run: |
          BIN="$(cabal list-bin exe:cardano-loans --project-file=cardano-loans-standalone.cabal)"
          test -x "$BIN"
          "$BIN" --help || true

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: cardano-loans-standalone-linux-x86_64
          path: ${{ github.workspace }}/dist-newstyle/**/cardano-loans
